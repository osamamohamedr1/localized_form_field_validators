# Publishes to pub.dev when a version tag such as v0.3.0 is pushed.
#
# One-time setup on pub.dev: package Admin page -> Automated publishing ->
# enable publishing from GitHub Actions for this repository with the tag
# pattern v{{version}}.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Lets pub.dev verify this workflow (OIDC).
    steps:
      - uses: actions/checkout@v4

      # Sets up the pub.dev OIDC credentials used by `flutter pub publish`.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Publish
        run: flutter pub publish --force
